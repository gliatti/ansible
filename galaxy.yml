  - .ansible
  - .vagrant
  - .collections
  - ansible.cfg
  - ansible.cfg.dpkg-dist
  - CLAUDE.md
  - Vagrantfile
  - hosts
  - offline-hosts
  - inventories
  - requirements.yml
  - "*.tar.gz"
