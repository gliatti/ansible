---
# barman est fourni par PGDG (dépôt pgdg-common sur RedHat).
- name: "Dépôt PGDG"
  ansible.builtin.include_role:
    name: postgresql
    tasks_from: repository_manager
  tags: barman-install

# Le module cron exige crontab, absent des images cloud Debian minimales.
- name: Managing barman and cron packages presence
  ansible.builtin.package:
    name:
      - barman
      - "{{ 'cron' if ansible_facts['os_family'] == 'Debian' else 'cronie' }}"
    state: present
  tags: barman-install

- name: "Création du répertoire {{ barman_home_directory }}"
  ansible.builtin.file:
    path: "{{ barman_home_directory }}"
    state: directory
    force: false
    group: barman
    owner: barman
    mode: "0755"
  tags: barman-install

- name: "Création du répertoire {{ barman_log_directory }}"
  ansible.builtin.file:
    path: "{{ barman_log_directory }}"
    state: directory
    force: false
    group: barman
    owner: barman
    mode: "0755"
  tags: barman-install

# Le paquet installe un cron "barman cron" toutes les minutes : usermod
# échoue si un processus barman tourne à cet instant, d'où les tentatives.
- name: "Changement du home côté système de l'utilisateur {{ barman_user_name }}"
  ansible.builtin.user:
    name: "{{ barman_user_name }}"
    home: "{{ barman_home_directory }}"
    state: present
  register: barman_user_home
  retries: 6
  delay: 10
  until: barman_user_home is succeeded
  tags: barman-install

- name: "Modification de la directive barman_home dans le fichier {{ barman_conf_file }}"
  ansible.builtin.lineinfile:
    path: "{{ barman_conf_file }}"
    regexp: "^barman_home"
    line: "barman_home = {{ barman_home_directory }}"
  tags: barman-install

- name: "Modification de la directive log_file dans le fichier {{ barman_conf_file }}"
  ansible.builtin.lineinfile:
    path: "{{ barman_conf_file }}"
    regexp: "^log_file"
    line: "log_file = {{ barman_log_file }}"
  tags: barman-install

- name: "Création du fichier {{ barman_pgpass_file }}"
  ansible.builtin.copy:
    content: ""
    dest: "{{ barman_pgpass_file }}"
    force: false
    group: barman
    owner: barman
    mode: "0600"
  tags: barman-install

- name: "Création du cron 'barman cron'"
  ansible.builtin.cron:
    user: "{{ barman_user_name }}"
    name: "barman cron"
    cron_file: barman
    job: "/usr/bin/barman cron >> {{ barman_log_directory }}/cron.log"
    state: present
    disabled: "{{ barman_cron_disabled }}"
    minute: "{{ barman_cron_schedule.minute }}"
    hour: "{{ barman_cron_schedule.hour | default(omit) }}"
    day: "{{ barman_cron_schedule.day | default(omit) }}"
    month: "{{ barman_cron_schedule.month | default(omit) }}"
    weekday: "{{ barman_cron_schedule.weekday | default(omit) }}"
  tags: barman-install
