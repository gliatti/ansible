---
- name: "Reload systemd daemon"
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: "Restart postgresql"
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    state: "restarted"
    enabled: true

- name: "Reload postgresql"
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    state: "reloaded"
