---
- name: "Install postgresql-common"
  ansible.builtin.apt:
    name: "postgresql-common"
    update_cache: true

- name: Configure default behavior
  ansible.builtin.lineinfile:
    dest: "/etc/postgresql-common/createcluster.conf"
    regexp: "^#?{{ current_postgresql_debian_createcluster_option.option }}.+$"
    line: "{{ current_postgresql_debian_createcluster_option.option }} = {{ current_postgresql_debian_createcluster_option.value }}"
    state: "{{ current_postgresql_debian_createcluster_option.state | default('present') }}"
  loop: "{{ postgresql_debian_createcluster_options }}"
  loop_control:
    loop_var: current_postgresql_debian_createcluster_option

- name: "Install postgresql packages"
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"

- name: "Creating PGDATA and WAL directories"
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ postgresql_sys_user }}"
    group: "{{ postgresql_sys_group }}"
    mode: "0700"
  loop:
    - "{{ postgresql_pgdata_main_directory }}"
    - "{{ postgresql_wal_main_directory }}"

- name: Check if PostgreSQL database is initialized.
  ansible.builtin.stat:
    path: "{{ postgresql_pgdata_main_directory }}/PG_VERSION"
  register: pgdata_dir_version

# Les options après "--" sont transmises à initdb : même initialisation que
# sur RedHat (WAL sur /pgwal, checksums, scram-sha-256).
- name: "Launching initdb"
  ansible.builtin.command: >-
    pg_createcluster {{ postgresql_version }} main
    -d {{ postgresql_pgdata_main_directory }}
    -- {{ postgresql_initdb_options | join(' ') }}
  when: not pgdata_dir_version.stat.exists
  vars:
    ansible_ssh_pipelining: "true"
  notify: "Restart postgresql"

# pg_createcluster déplace pg_hba.conf et pg_ident.conf dans
# /etc/postgresql/<v>/main ; la configuration du rôle (hba_file, ident_file)
# et hba_manager les attendent dans PGDATA comme sur RedHat.
- name: "pg_hba.conf et pg_ident.conf initiaux dans PGDATA"
  ansible.builtin.copy:
    src: "/etc/postgresql/{{ postgresql_version }}/main/{{ item }}"
    dest: "{{ postgresql_pgdata_main_directory }}/{{ item }}"
    remote_src: true
    force: false
    owner: "{{ postgresql_sys_user }}"
    group: "{{ postgresql_sys_group }}"
    mode: "0600"
  loop:
    - pg_hba.conf
    - pg_ident.conf
