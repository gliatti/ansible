---
- name: "Configure pgpass authentication (if entries are configured)"
  ansible.builtin.template:
    src: ".pgpass.j2"
    dest: "{{ postgresql_home_directory }}/.pgpass"
    owner: "{{ postgresql_sys_user }}"
    group: "{{ postgresql_sys_group }}"
    mode: "0600"
  no_log: true
  when: pg_pass is defined
