---
- name: Install postgresql packages
  ansible.builtin.package:
    name: '{{ postgresql_packages }}'

- name: "Creating PGDATA and WAL directories"
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ postgresql_sys_user }}"
    group: "{{ postgresql_sys_group }}"
    mode: "0700"
  loop:
    - "{{ postgresql_pgdata_main_directory }}"
    - "{{ postgresql_wal_main_directory }}"

- name: Check if PostgreSQL database is initialized.
  ansible.builtin.stat:
    path: "{{ postgresql_pgdata_main_directory }}/PG_VERSION"
  register: pgdata_dir_version

- name: "Launching initdb"
  ansible.builtin.command: >-
    {{ postgresql_path_bin }}/initdb
    --pgdata='{{ postgresql_pgdata_main_directory }}'
    {{ postgresql_initdb_options | join(' ') }}
  become: true
  become_user: postgres
  when: not pgdata_dir_version.stat.exists
  vars:
    ansible_ssh_pipelining: "true"
  notify: "Restart postgresql"

# Drop-in systemd : le fichier /usr/lib/systemd/system/postgresql-NN.service
# appartient au RPM et serait écrasé à chaque mise à jour mineure.
- name: "Répertoire du drop-in systemd de {{ postgresql_service_name }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ postgresql_service_name }}.service.d"
    state: directory
    mode: "0755"

- name: "Drop-in systemd PGDATA du service {{ postgresql_service_name }}"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ postgresql_service_name }}.service.d/override.conf"
    mode: "0644"
    content: |
      [Service]
      Environment=PGDATA={{ postgresql_pgdata_main_directory }}
  notify:
    - "Reload systemd daemon"
    - "Restart postgresql"
