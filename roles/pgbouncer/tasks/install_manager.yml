---
- name: "Chargement des variables spécifiques à la distribution"
  ansible.builtin.include_vars: '{{ ansible_facts["os_family"] }}.yml'
  when: ansible_facts['os_family'] == 'RedHat'

# pgbouncer est fourni par PGDG (dépôt pgdg-common sur RedHat).
- name: "Dépôt PGDG"
  ansible.builtin.include_role:
    name: postgresql
    tasks_from: repository_manager

- name: "Install pgbouncer packages"
  ansible.builtin.package:
    name: "{{ pgbouncer_packages }}"
    state: "present"

# pgbouncer.ini est déployé avant le premier démarrage pour que la socket,
# le pid et le journal ne prennent jamais les valeurs par défaut du paquet.
- name: "Configuration de pgbouncer.ini"
  ansible.builtin.import_tasks: database_entries_manager.yml

- name: "Service pgbouncer démarré et activé"
  ansible.builtin.service:
    name: "pgbouncer"
    state: "started"
    enabled: true
