---
# Toujours déployé : pgbouncer.ini porte aussi la socket, l'authentification
# et les paramètres de pool, pas seulement les entrées [databases].
- name: "Configuration de pgbouncer.ini"
  ansible.builtin.template:
    src: "pgbouncer.ini.j2"
    dest: "{{ pgbouncer_inifile }}"
    owner: "{{ pgbouncer_sys_user }}"
    group: "{{ pgbouncer_sys_group }}"
    mode: "0600"
  notify: Restart pgbouncer
