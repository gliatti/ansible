---
- name: "Ajout du dépôt principal de la release courante"
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian {{ ansible_facts['distribution_release'] }} {{ debian_sources_components }}"
    state: "present"
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: "Ajout du dépôt security de la release courante"
  ansible.builtin.apt_repository:
    repo: "deb http://security.debian.org/debian-security {{ ansible_facts['distribution_release'] }}-security {{ debian_sources_components }}"
    state: "present"
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
