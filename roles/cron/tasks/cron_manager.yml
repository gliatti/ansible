---
- name: "Paquet cron"
  ansible.builtin.package:
    name: "{{ cron_package }}"
    state: "present"

# Les fichiers de /etc/cron.d sont écrits par le module en root:root 0644 :
# cron refuse un fichier appartenant à un autre utilisateur, et comme ces
# fichiers portent un champ "utilisateur", un propriétaire non root pourrait
# y planifier des commandes exécutées par root. Ne pas les chown.
- name: "Gestion des crons"
  ansible.builtin.cron:
    user: "{{ cron_schedule.user }}"
    name: "{{ cron_schedule.name }}"
    cron_file: "{{ cron_schedule.cron_file }}"
    job: "{{ cron_schedule.job }}"
    state: "{{ cron_schedule.state }}"
    disabled: "{{ cron_schedule.disabled }}"
    minute: "{{ cron_schedule.minute }}"
    hour: "{{ cron_schedule.hour }}"
    day: "{{ cron_schedule.day }}"
    month: "{{ cron_schedule.month }}"
    weekday: "{{ cron_schedule.weekday }}"
  loop: "{{ cron_schedules }}"
  loop_control:
    loop_var: cron_schedule
