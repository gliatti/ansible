# ansible/roles/ldap2pg/defaults/main.yml
---
ldap2pg_version: 6
ldap2pg_dc: "DC=foo,DC=fr"
ldap2pg_ldap_url: "ldaps://foo.fr:123"
ldap2pg_binddn_cn: "CN=adUser"
ldap2pg_binddn_password: "password"
ldap2pg_default_users_ou: "OU=Users"
ldap2pg_binddn_user_ou: "{{ ldap2pg_default_users_ou }}"
ldap2pg_field_member: "sAMAccountName"
ldap2pg_groups:
  - role: "myCN"
    ou: "OU=Users,OU=IT" # omit if equals to ldap2pg_default_users_ou
    privilege: "owner"
    databases:
      - "pgbench"
    schemas:
      - "public"
    options: "LOGIN INHERIT"
ldap2pg_conf_directory: "/etc/ldap2pg"
# Clé apt Dalibo Labs (binaire) référencée par signed-by : apt-key n'existe
# plus sur Debian 13.
ldap2pg_apt_keyring: "/etc/apt/keyrings/dalibo-labs.gpg"
# Mot de passe du bind LDAP, lu par ldap2pg via la directive PASSWORD_FILE
# de ~postgres/ldaprc (ldap2pg refuse un fichier lisible par "other").
ldap2pg_postgres_home: "{{ '/var/lib/pgsql' if ansible_facts['os_family'] == 'RedHat' else '/var/lib/postgresql' }}"
ldap2pg_password_file: "{{ ldap2pg_postgres_home }}/.ldappass"
# Vérification du certificat du serveur LDAP (valeur OpenLDAP : demand,
# allow, never, try). "allow" désactive la vérification.
ldap2pg_tls_reqcert: "demand"
ldap2pg_roles_blacklist_query:
  - postgres
  - pg_*
