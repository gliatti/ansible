---
- name: Add the dalibo labs repository for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: '{{ ansible_facts["os_family"] }}/main.yml'

- name: "Install ldap2pg packages"
  ansible.builtin.package:
    name: "ldap2pg"
    state: "present"

- name: "Creating ldap2pg conf directory"
  ansible.builtin.file:
    state: directory
    path: "{{ ldap2pg_conf_directory }}"
    owner: "postgres"
    group: "postgres"
    mode: "0700"

- name: "Configure ldap2pg configuration"
  ansible.builtin.template:
    src: "ldap2pg.yml.j2"
    dest: "{{ ldap2pg_conf_directory }}/ldap2pg.yml"
    owner: "postgres"
    group: "postgres"
    mode: "0600"
  when: ldap2pg_groups is defined

# ldap2pg lit ~/ldaprc, ~/.ldaprc, ./ldaprc, /etc/ldap/ldap.conf et les
# variables LDAP* ; le mot de passe vient de PASSWORD_FILE (cf. ldaprc.j2).
- name: "Fichier du mot de passe LDAP {{ ldap2pg_password_file }}"
  ansible.builtin.template:
    src: ".ldappass.j2"
    dest: "{{ ldap2pg_password_file }}"
    owner: "postgres"
    group: "postgres"
    mode: "0600"

- name: "Create ~postgres/ldaprc file"
  ansible.builtin.template:
    src: "ldaprc.j2"
    dest: "{{ ldap2pg_postgres_home }}/ldaprc"
    owner: "postgres"
    group: "postgres"
    mode: "0600"

